name: Nightly

# The stateful store tests (#381) at length: many more random sequences than
# make check runs, on both stores. A failure prints the shortest sequence that
# breaks an invariant, to turn into a fixed test.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  stateful:
    name: Stateful store tests, nightly profile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install
        run: uv sync --locked --all-groups

      - name: Stateful tests
        env:
          JOTFLOW_HYPOTHESIS_PROFILE: nightly
        run: uv run pytest -q -p no:cacheprovider tests/test_stateful.py
