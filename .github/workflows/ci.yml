name: CI

# Runs on forked pull requests with a read-only token. Never switch this to
# pull_request_target: that would hand repository secrets to fork code.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check, test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Install
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy

      - name: Test
        run: uv run pytest -q

  image:
    name: Build container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Plain docker CLI: nothing is pushed, so no registry login or
      # third-party build action is needed.
      - name: Validate Compose file
        run: docker compose config --quiet

      - name: Build
        run: docker build --tag jotflow:ci .

      - name: Smoke test
        run: |
          docker run --rm jotflow:ci jotflow --version
          test "$(docker run --rm jotflow:ci id -u)" = "10001"
          if docker run --rm jotflow:ci sh -c 'command -v node || command -v npm || command -v uv'; then
            echo "::error::The JotFlow image must not contain Node, npm, or uv"
            exit 1
          fi
