name: CI

# Runs on forked pull requests with a read-only token. Never switch this to
# pull_request_target: that would hand repository secrets to fork code.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check, test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Install
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy

      # Line and branch coverage; fails below fail_under in pyproject.toml.
      - name: Test with coverage
        run: uv run pytest -q --cov --cov-report=term-missing

      # Checks the floor again from the data file, so turning coverage off in
      # pytest's options cannot pass silently: no data fails with "No data to
      # report". The floor is still read from pyproject.toml.
      - name: Coverage floor
        run: uv run coverage report --format=total

  codex-gate:
    # The codex preset's security gate (#22): with the pinned Codex and this
    # preset's own config, no shell or exec tool is offered, apply_patch is
    # refused, and JotFlow's MCP server is reached. Codex talks only to a
    # scripted fake model API on 127.0.0.1, so nothing is spent.
    name: Codex preset gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install
        run: uv sync --locked --all-groups

      # From .github/ci/codex's lockfile, so every package is pinned by integrity hash.
      - name: Install the pinned Codex
        working-directory: .github/ci/codex
        run: |
          npm ci --no-fund --no-audit
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Gate
        env:
          JOTFLOW_REQUIRE_CODEX: "1"
        run: uv run pytest -q -p no:cacheprovider tests/test_codex_gate.py

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      # Every action pinned by commit SHA, least permissions, no template
      # injection, no persisted credentials (#60). Online audits also catch a
      # SHA that isn't really in the action's repo.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor@1.31.1 --format=github .github/workflows

      # Workflow syntax, expressions, and every run: script through shellcheck,
      # which the runner image already has. The binary is pinned by checksum.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum -c -
          tar xzf "$archive" actionlint
          ./actionlint -color

  eol:
    name: Line endings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Checks what is committed, not the runner's checkout, so a CRLF file
      # is caught whatever the attributes or the runner's Git settings say.
      - name: Every committed file uses LF
        run: |
          if git ls-files --eol | grep -E '^i/(crlf|mixed)'; then
            echo "::error::The files above are committed with CRLF line endings. All files must use LF; see AGENTS.md."
            exit 1
          fi

  image:
    name: Build container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Plain docker CLI: nothing is pushed, so no registry login or
      # third-party build action is needed. The tag matches the image name in
      # docker/docker-compose.yml, so the Compose checks below reuse this build.
      - name: Validate Compose files
        run: |
          docker compose --project-directory . -f docker/docker-compose.yml config --quiet
          docker compose --project-directory . -f docker/docker-compose.yml -f docker/docker-compose.policy.yml config --quiet

      - name: Build
        run: docker build --file docker/Dockerfile --tag jotflow:local .

      - name: Health check on the read-only image
        run: |
          # No heartbeat yet: unhealthy, exit 1.
          if docker run --rm --read-only --tmpfs /tmp jotflow:local jotflow health; then
            echo "::error::jotflow health passed with no heartbeat"
            exit 1
          fi
          # A fresh heartbeat: healthy, with no tokens and no network.
          docker run --rm --read-only --tmpfs /tmp --network none jotflow:local sh -c \
            'python -c "import time; open(\"/tmp/jotflow-heartbeat\", \"w\").write(str(int(time.time())))" && jotflow health'
          test "$(docker compose --project-directory . -f docker/docker-compose.yml config --format json | python3 -c 'import json, sys; print(json.load(sys.stdin)["services"]["jotflow"]["healthcheck"]["test"])')" = "['CMD', 'jotflow', 'health']"

      - name: Smoke test
        run: |
          docker run --rm jotflow:local jotflow --version
          test "$(docker run --rm jotflow:local id -u)" = "10001"
          if docker run --rm jotflow:local sh -c 'command -v node || command -v npm || command -v uv'; then
            echo "::error::The JotFlow image must not contain Node, npm, or uv"
            exit 1
          fi

      - name: Policy file mount
        run: |
          install -m 0644 examples/jotflow.example.toml jotflow.toml
          compose=(docker compose --project-directory . -f docker/docker-compose.yml -f docker/docker-compose.policy.yml)
          "${compose[@]}" run --rm jotflow python -c \
            'import os; from jotflow.policy import load_policy; load_policy(os.environ["JOTFLOW_CONFIG"]); print("policy loaded")'
          # shellcheck disable=SC2016 # expanded inside the container, not here
          if "${compose[@]}" run --rm jotflow sh -c 'echo x >> "$JOTFLOW_CONFIG"' 2>/dev/null; then
            echo "::error::The policy file must be mounted read-only"
            exit 1
          fi

      # The live check posts to Slack, so it refuses inside the image and runs
      # on the host. The offline check still works here. Dummy tokens only.
      - name: Live check refuses in the image
        run: |
          compose=(docker compose --project-directory . -f docker/docker-compose.yml -f docker/docker-compose.policy.yml)
          tokens=(-e JOTFLOW_SLACK_BOT_TOKEN=xoxb-ci -e JOTFLOW_SLACK_APP_TOKEN=xapp-ci)
          "${compose[@]}" run --rm "${tokens[@]}" jotflow jotflow check
          if "${compose[@]}" run --rm "${tokens[@]}" -e JOTFLOW_LIVE_CHECK=1 jotflow jotflow check --live > live.out 2>&1; then
            cat live.out
            echo "::error::jotflow check --live must refuse inside the JotFlow image"
            exit 1
          fi
          cat live.out
          grep -q "run the live check on the host" live.out

  agent-image:
    name: Build agent image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # D6 as Compose policy: nothing is published, nothing shares the host
      # network or mounts the Docker socket, neither agent service can reach
      # .env or the checkout, and the write GitHub token exists only where
      # drafting runs never go. Compose resolves env files into each service's
      # environment, so sentinels show exactly where each file goes.
      - name: Compose policy
        run: |
          printf 'JOTFLOW_SLACK_BOT_TOKEN=ci-sentinel-bot\n' > .env
          printf 'JOTFLOW_RUNNER_SECRET=ci-runner-secret\nJOTFLOW_GITHUB_READ_TOKEN=ci-read\n' > agent.env
          printf 'JOTFLOW_RUNNER_SECRET=ci-exec-secret\nJOTFLOW_GITHUB_WRITE_TOKEN=ci-write\n' > agent-exec.env
          for files in "-f docker/docker-compose.yml" "-f docker/docker-compose.yml -f docker/docker-compose.policy.yml"; do
            read -ra file_args <<< "$files"
            touch jotflow.toml
            docker compose --project-directory . "${file_args[@]}" --profile agent config --format json > compose.json
            python3 - <<'PY'
          import json
          services = json.load(open("compose.json"))["services"]
          assert set(services) == {"jotflow", "agent", "agent-exec"}, sorted(services)
          for name, service in services.items():
              assert not service.get("ports"), f"{name} publishes ports"
              assert service.get("network_mode") != "host", f"{name} uses the host network"
              assert not service.get("privileged"), f"{name} is privileged"
              for volume in service.get("volumes") or []:
                  assert "docker.sock" not in str(volume.get("source", "")), f"{name} mounts the Docker socket"
          expected = {
              "agent": {"JOTFLOW_RUNNER_SECRET": "ci-runner-secret",
                        "JOTFLOW_GITHUB_READ_TOKEN": "ci-read",
                        "JOTFLOW_RUNNER_KINDS": "drafting,question",
                        "JOTFLOW_RUNNER_ALLOWED_HOSTS": "agent"},
              "agent-exec": {"JOTFLOW_RUNNER_SECRET": "ci-exec-secret",
                             "JOTFLOW_GITHUB_WRITE_TOKEN": "ci-write",
                             "JOTFLOW_RUNNER_KINDS": "execution",
                             "JOTFLOW_RUNNER_ALLOWED_HOSTS": "agent-exec"},
          }
          for name, environment in expected.items():
              service = services[name]
              # Exactly its own env file: no .env, and not the other token.
              assert (service.get("environment") or {}) == environment, (name, service.get("environment"))
              binds = [v for v in service.get("volumes") or [] if v.get("type") == "bind"]
              assert not binds, f"{name} bind-mounts {binds}"
          homes = {name: [v["source"] for v in services[name]["volumes"]] for name in expected}
          assert homes["agent"] != homes["agent-exec"], f"the agent services share a home: {homes}"
          # Each runner has its own secret, so one cannot start runs on the other.
          secrets = {services[n]["environment"]["JOTFLOW_RUNNER_SECRET"] for n in expected}
          assert len(secrets) == 2, "the two runners must not share a secret"
          # The drafting agent cannot reach agent-exec at all: no shared network.
          networks = {name: set(services[name]["networks"]) for name in expected}
          assert not networks["agent"] & networks["agent-exec"], f"agent services share {networks}"
          assert {"agents", "agents-exec"} <= set(services["jotflow"]["networks"])
          # The checks above mean something: .env does reach JotFlow.
          assert services["jotflow"]["environment"]["JOTFLOW_SLACK_BOT_TOKEN"] == "ci-sentinel-bot"
          print("compose policy ok")
          PY
          done
          rm -f .env agent.env agent-exec.env jotflow.toml compose.json

      - name: Build
        run: docker build --file docker/Dockerfile.agent --tag jotflow-agent:local .

      - name: Smoke test
        run: |
          test "$(docker run --rm jotflow-agent:local id -u)" = "10002"
          docker run --rm jotflow-agent:local node --version
          docker run --rm jotflow-agent:local jotflow --version

      # D6: Slack tokens in JotFlow's .env never reach the agent container. The
      # values are dummy sentinels, never real tokens.
      - name: No Slack variable inside the agent container
        run: |
          printf 'JOTFLOW_SLACK_BOT_TOKEN=ci-sentinel-bot\nJOTFLOW_SLACK_APP_TOKEN=ci-sentinel-app\n' > .env
          secret="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          printf 'JOTFLOW_RUNNER_SECRET=%s\nJOTFLOW_AGENT_COMMAND=["true"]\nJOTFLOW_GITHUB_READ_TOKEN=ci-read\n' "$secret" > agent.env
          if docker compose --project-directory . -f docker/docker-compose.yml run --rm --no-deps agent env | grep -q ci-sentinel; then
            echo "::error::The agent container can see JotFlow's Slack tokens"
            exit 1
          fi
          docker compose --project-directory . -f docker/docker-compose.yml up -d --no-deps agent
          for _ in $(seq 1 30); do
            if docker compose --project-directory . -f docker/docker-compose.yml exec -T agent python -c 'import socket; socket.create_connection(("127.0.0.1", 8766), 1)' 2>/dev/null; then break; fi
            sleep 1
          done
          if docker compose --project-directory . -f docker/docker-compose.yml exec -T agent sh -c 'tr "\0" "\n" < /proc/1/environ' | grep -q ci-sentinel; then
            echo "::error::The runner process can see JotFlow's Slack tokens"
            exit 1
          fi
          docker compose --project-directory . -f docker/docker-compose.yml exec -T -e SECRET="$secret" agent python -c '
          import os, urllib.error, urllib.request
          def status(auth):
              headers = {"Authorization": auth} if auth else {}
              request = urllib.request.Request("http://127.0.0.1:8766/runs/none", headers=headers)
              try:
                  return urllib.request.urlopen(request).status
              except urllib.error.HTTPError as exc:
                  return exc.code
          assert status(None) == 401, "the runner must refuse calls without its secret"
          assert status("Bearer " + os.environ["SECRET"]) == 404
          print("runner gate ok")'
          docker compose --project-directory . -f docker/docker-compose.yml --profile agent down

      # The execution runner holds only the write token, has its own secret, and
      # refuses drafting runs; started the same way, with its own env file.
      - name: Execution runner refuses drafting runs
        run: |
          printf 'JOTFLOW_SLACK_BOT_TOKEN=ci-sentinel-bot\n' > .env
          secret="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          drafting_secret="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          printf 'JOTFLOW_RUNNER_SECRET=%s\nJOTFLOW_AGENT_COMMAND=["true"]\nJOTFLOW_GITHUB_WRITE_TOKEN=ci-write\n' "$secret" > agent-exec.env
          docker compose --project-directory . -f docker/docker-compose.yml up -d --no-deps agent-exec
          for _ in $(seq 1 30); do
            if docker compose --project-directory . -f docker/docker-compose.yml exec -T agent-exec python -c 'import socket; socket.create_connection(("127.0.0.1", 8766), 1)' 2>/dev/null; then break; fi
            sleep 1
          done
          if docker compose --project-directory . -f docker/docker-compose.yml exec -T agent-exec sh -c 'tr "\0" "\n" < /proc/1/environ' | grep -q ci-sentinel; then
            echo "::error::The execution runner can see JotFlow's Slack tokens"
            exit 1
          fi
          docker compose --project-directory . -f docker/docker-compose.yml exec -T -e SECRET="$secret" -e OTHER="$drafting_secret" agent-exec python -c '
          import json, os, urllib.error, urllib.request
          def launch(secret, kind):
              body = json.dumps({"run_id": "run-1", "kind": kind, "token": "jfr_" + "x" * 43}).encode()
              request = urllib.request.Request("http://127.0.0.1:8766/runs", data=body, method="POST",
                  headers={"Authorization": "Bearer " + secret, "Content-Type": "application/json"})
              try:
                  return urllib.request.urlopen(request).status
              except urllib.error.HTTPError as exc:
                  return exc.code
          # The drafting runner'"'"'s secret starts nothing here.
          assert launch(os.environ["OTHER"], "execution") == 401
          assert launch(os.environ["SECRET"], "drafting") == 403
          print("execution runner refuses drafting ok")'
          docker compose --project-directory . -f docker/docker-compose.yml --profile agent down

      # Separate networks: the drafting agent cannot even open a connection to
      # agent-exec, while JotFlow, on both networks, can reach each runner.
      - name: Drafting agent cannot reach agent-exec
        run: |
          printf 'JOTFLOW_RUNNER_SECRET=%s\nJOTFLOW_AGENT_COMMAND=["true"]\nJOTFLOW_GITHUB_READ_TOKEN=ci-read\n' "$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')" > agent.env
          printf 'JOTFLOW_RUNNER_SECRET=%s\nJOTFLOW_AGENT_COMMAND=["true"]\nJOTFLOW_GITHUB_WRITE_TOKEN=ci-write\n' "$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')" > agent-exec.env
          docker compose --project-directory . -f docker/docker-compose.yml up -d --no-deps agent agent-exec
          for service in agent agent-exec; do
            for _ in $(seq 1 30); do
              if docker compose --project-directory . -f docker/docker-compose.yml exec -T "$service" python -c 'import socket; socket.create_connection(("127.0.0.1", 8766), 1)' 2>/dev/null; then break; fi
              sleep 1
            done
          done
          docker compose --project-directory . -f docker/docker-compose.yml exec -T agent python -c '
          import socket
          for host in ("agent-exec", "jotflow-agent-exec-1"):
              try:
                  socket.create_connection((host, 8766), 3).close()
              except OSError:
                  continue
              raise SystemExit(f"the drafting agent reached {host}:8766")
          print("agent cannot reach agent-exec ok")'
          # The check above is not vacuous: from the agents-exec network, where
          # JotFlow sits, agent-exec is reachable.
          # Compose prefixes network names with the project name; ask it.
          exec_net="$(docker compose --project-directory . -f docker/docker-compose.yml --profile agent config --format json \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["networks"]["agents-exec"]["name"])')"
          docker run --rm --network "$exec_net" jotflow-agent:local python -c '
          import socket
          socket.create_connection(("agent-exec", 8766), 3).close()
          print("agents-exec reaches agent-exec ok")'
          docker compose --project-directory . -f docker/docker-compose.yml --profile agent down
          rm -f .env agent.env agent-exec.env

  # JotFlow launches a run in each agent container and the agent calls back
  # over MCP with its token, across containers (#54, #55). Stub agents, no
  # Slack, no model, no GitHub.
  cross-container:
    name: Cross-container runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: |
          docker build --file docker/Dockerfile --tag jotflow:local .
          docker build --file docker/Dockerfile.agent --tag jotflow-agent:local .

      - name: JotFlow launches a run in each agent container
        run: tests/compose/reach_check.sh
