name: CI

# Runs on forked pull requests with a read-only token. Never switch this to
# pull_request_target: that would hand repository secrets to fork code.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check, test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Install
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy

      # Line and branch coverage; fails below fail_under in pyproject.toml.
      - name: Test with coverage
        run: uv run pytest -q --cov --cov-report=term-missing

      # Checks the floor again from the data file, so turning coverage off in
      # pytest's options cannot pass silently: no data fails with "No data to
      # report". The floor is still read from pyproject.toml.
      - name: Coverage floor
        run: uv run coverage report --format=total

  eol:
    name: Line endings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Checks what is committed, not the runner's checkout, so a CRLF file
      # is caught whatever the attributes or the runner's Git settings say.
      - name: Every committed file uses LF
        run: |
          if git ls-files --eol | grep -E '^i/(crlf|mixed)'; then
            echo "::error::The files above are committed with CRLF line endings. All files must use LF; see AGENTS.md."
            exit 1
          fi

  image:
    name: Build container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Plain docker CLI: nothing is pushed, so no registry login or
      # third-party build action is needed. The tag matches the image name in
      # docker-compose.yml, so the Compose checks below reuse this build.
      - name: Validate Compose files
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.policy.yml config --quiet

      - name: Build
        run: docker build --tag jotflow:local .

      - name: Smoke test
        run: |
          docker run --rm jotflow:local jotflow --version
          test "$(docker run --rm jotflow:local id -u)" = "10001"
          if docker run --rm jotflow:local sh -c 'command -v node || command -v npm || command -v uv'; then
            echo "::error::The JotFlow image must not contain Node, npm, or uv"
            exit 1
          fi

      - name: Policy file mount
        run: |
          install -m 0644 jotflow.example.toml jotflow.toml
          compose="docker compose -f docker-compose.yml -f docker-compose.policy.yml"
          $compose run --rm jotflow python -c \
            'import os; from jotflow.policy import load_policy; load_policy(os.environ["JOTFLOW_CONFIG"]); print("policy loaded")'
          if $compose run --rm jotflow sh -c 'echo x >> "$JOTFLOW_CONFIG"' 2>/dev/null; then
            echo "::error::The policy file must be mounted read-only"
            exit 1
          fi

      # The live check posts to Slack, so it refuses inside the image and runs
      # on the host. The offline check still works here. Dummy tokens only.
      - name: Live check refuses in the image
        run: |
          compose="docker compose -f docker-compose.yml -f docker-compose.policy.yml"
          tokens="-e JOTFLOW_SLACK_BOT_TOKEN=xoxb-ci -e JOTFLOW_SLACK_APP_TOKEN=xapp-ci"
          $compose run --rm $tokens jotflow jotflow check
          if $compose run --rm $tokens -e JOTFLOW_LIVE_CHECK=1 jotflow jotflow check --live > live.out 2>&1; then
            cat live.out
            echo "::error::jotflow check --live must refuse inside the JotFlow image"
            exit 1
          fi
          cat live.out
          grep -q "run the live check on the host" live.out

  agent-image:
    name: Build agent image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build
        run: docker build --file Dockerfile.agent --tag jotflow-agent:local .

      - name: Smoke test
        run: |
          test "$(docker run --rm jotflow-agent:local id -u)" = "10002"
          docker run --rm jotflow-agent:local node --version
          docker run --rm jotflow-agent:local jotflow --version

      # D6: Slack tokens in JotFlow's .env never reach the agent container. The
      # values are dummy sentinels, never real tokens.
      - name: No Slack variable inside the agent container
        run: |
          printf 'JOTFLOW_SLACK_BOT_TOKEN=ci-sentinel-bot\nJOTFLOW_SLACK_APP_TOKEN=ci-sentinel-app\n' > .env
          secret="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          printf 'JOTFLOW_RUNNER_SECRET=%s\nJOTFLOW_AGENT_COMMAND=["true"]\nJOTFLOW_GITHUB_READ_TOKEN=ci-read\n' "$secret" > agent.env
          if docker compose run --rm --no-deps agent env | grep -q ci-sentinel; then
            echo "::error::The agent container can see JotFlow's Slack tokens"
            exit 1
          fi
          docker compose up -d --no-deps agent
          for _ in $(seq 1 30); do
            if docker compose exec -T agent python -c 'import socket; socket.create_connection(("127.0.0.1", 8766), 1)' 2>/dev/null; then break; fi
            sleep 1
          done
          if docker compose exec -T agent sh -c 'tr "\0" "\n" < /proc/1/environ' | grep -q ci-sentinel; then
            echo "::error::The runner process can see JotFlow's Slack tokens"
            exit 1
          fi
          docker compose exec -T -e SECRET="$secret" agent python -c '
          import os, urllib.error, urllib.request
          def status(auth):
              headers = {"Authorization": auth} if auth else {}
              request = urllib.request.Request("http://127.0.0.1:8766/runs/none", headers=headers)
              try:
                  return urllib.request.urlopen(request).status
              except urllib.error.HTTPError as exc:
                  return exc.code
          assert status(None) == 401, "the runner must refuse calls without its secret"
          assert status("Bearer " + os.environ["SECRET"]) == 404
          print("runner gate ok")'
          docker compose --profile agent down
