name: Release

# A version tag vX.Y.Z publishes both images to GHCR, for amd64 and arm64,
# as :X.Y.Z, and :latest when it is the highest release, each with a signed build provenance attestation
# (#39), and then the Python package to PyPI through trusted publishing, with
# the same version (#87). A pull request that touches this file or a Dockerfile runs the same
# builds and pushes nothing, so a release is proven before its tag exists.
#
# No secrets beyond GITHUB_TOKEN, no third-party build actions (the runner's
# own docker buildx builds natively on each architecture's runner), and every
# action pinned by commit SHA.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    paths:
      - .github/workflows/release.yml
      - docker/**
      # The package and the deployment files it carries (#87).
      - examples/agent.env.example
      - examples/agent-exec.env.example
      - pyproject.toml
      - src/jotflow/__init__.py
      - src/jotflow/deploy.py
      - src/jotflow/templates/**

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: jnkman787

jobs:
  version:
    name: Version matches the tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
      agent_packages: ${{ steps.check.outputs.agent_packages }}
      latest: ${{ steps.check.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # A release checks from a clean slate: no cache another run could have poisoned.
          enable-cache: false

      - name: Check uv.lock matches pyproject.toml
        # A version bump without `uv lock` leaves the lock naming the old
        # version; fail the release rather than tag a stale lock.
        run: uv lock --check

      - name: Check the tag, pyproject.toml and __version__ agree
        id: check
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, re, tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          init = re.search(r'^__version__ = "([^"]+)"$', Path("src/jotflow/__init__.py").read_text(), re.M)
          module = init.group(1) if init else None
          compose = Path("docker/docker-compose.yml").read_text()
          pin = re.search(r'AGENT_NPM_PACKAGES: "([^"]+)"', compose)
          if not pin:
              raise SystemExit("::error::no AGENT_NPM_PACKAGES pin in docker/docker-compose.yml")
          publish = os.environ["REF_TYPE"] == "tag"
          if publish:
              tag = os.environ["REF_NAME"]
              if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
                  raise SystemExit(f"::error::{tag} is not a vX.Y.Z tag")
              version = tag[1:]
              if project != version or module != version:
                  raise SystemExit(
                      f"::error::tag {tag} but pyproject.toml says {project} "
                      f"and __version__ says {module}"
                  )
          else:
              version = project
          # :latest only for the highest release, so a fix to an older line
          # never moves it backwards.
          latest = False
          if publish:
              import subprocess
              listed = subprocess.run(
                  ["git", "ls-remote", "--tags", "--refs", os.environ["REPO_URL"]],
                  check=True, capture_output=True, text=True,
              ).stdout
              released = [
                  tuple(int(n) for n in m.groups())
                  for m in re.finditer(r"refs/tags/v([0-9]+)\.([0-9]+)\.([0-9]+)$", listed, re.M)
              ]
              mine = tuple(int(n) for n in version.split("."))
              latest = all(other <= mine for other in released)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={version}\n")
              out.write(f"publish={'true' if publish else 'false'}\n")
              out.write(f"agent_packages={pin.group(1)}\n")
              out.write(f"latest={'true' if latest else 'false'}\n")
          print(f"version {version}, publish {publish}, latest {latest}, agent CLI {pin.group(1)}")
          PY

  dry-run:
    name: Build ${{ matrix.image }} (${{ matrix.arch }}), no push
    needs: version
    if: needs.version.outputs.publish != 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read # a pull request builds and pushes nothing
    strategy:
      fail-fast: true
      matrix:
        image: [jotflow, jotflow-agent]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - image: jotflow
            dockerfile: docker/Dockerfile
          - image: jotflow-agent
            dockerfile: docker/Dockerfile.agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build, push nothing
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.version.outputs.version }}
          AGENT_PACKAGES: ${{ needs.version.outputs.agent_packages }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx create --use --name release >/dev/null
          args=(
            --platform "linux/$ARCH"
            --file "$DOCKERFILE"
            --provenance=mode=max
            --label "org.opencontainers.image.source=$SOURCE"
            --label "org.opencontainers.image.revision=$REVISION"
            --label "org.opencontainers.image.version=$VERSION"
            --label "org.opencontainers.image.licenses=Apache-2.0"
            --metadata-file metadata.json
          )
          if [ "$DOCKERFILE" = docker/Dockerfile.agent ]; then
            args+=(--build-arg "AGENT_NPM_PACKAGES=$AGENT_PACKAGES")
          fi
          docker buildx build "${args[@]}" --output type=cacheonly .

  build:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write # push by digest
    strategy:
      fail-fast: true
      matrix:
        image: [jotflow, jotflow-agent]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - image: jotflow
            dockerfile: docker/Dockerfile
          - image: jotflow-agent
            dockerfile: docker/Dockerfile.agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login "$REGISTRY" -u "$ACTOR" --password-stdin

      - name: Build and push by digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.version.outputs.version }}
          AGENT_PACKAGES: ${{ needs.version.outputs.agent_packages }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx create --use --name release >/dev/null
          args=(
            --platform "linux/$ARCH"
            --file "$DOCKERFILE"
            --provenance=mode=max
            --label "org.opencontainers.image.source=$SOURCE"
            --label "org.opencontainers.image.revision=$REVISION"
            --label "org.opencontainers.image.version=$VERSION"
            --label "org.opencontainers.image.licenses=Apache-2.0"
            --metadata-file metadata.json
          )
          if [ "$DOCKERFILE" = docker/Dockerfile.agent ]; then
            args+=(--build-arg "AGENT_NPM_PACKAGES=$AGENT_PACKAGES")
          fi
          args+=(--output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true")
          docker buildx build "${args[@]}" .
          mkdir -p digests
          digest=$(python3 -c 'import json; print(json.load(open("metadata.json"))["containerimage.digest"])')
          touch "digests/${digest#sha256:}"

      - name: Keep the digest for publishing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest--${{ matrix.image }}--${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.image }}
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # tag the index
      id-token: write # sign the attestation
      attestations: write # store it
    strategy:
      matrix:
        image: [jotflow, jotflow-agent]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest--${{ matrix.image }}--*
          path: digests
          merge-multiple: true

      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login "$REGISTRY" -u "$ACTOR" --password-stdin

      - name: Tag one index for both architectures
        id: index
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          VERSION: ${{ needs.version.outputs.version }}
          LATEST: ${{ needs.version.outputs.latest }}
        run: |
          set -euo pipefail
          sources=()
          for file in digests/*; do sources+=("$IMAGE@sha256:$(basename "$file")"); done
          test "${#sources[@]}" -eq 2
          tags=(--tag "$IMAGE:$VERSION")
          if [ "$LATEST" = true ]; then tags+=(--tag "$IMAGE:latest"); fi
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["digest"])')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "$IMAGE:$VERSION is $digest"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

  package:
    name: Build the Python package
    needs: version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # A release builds from a clean slate: no cache another run could have poisoned.
          enable-cache: false

      - name: Build the sdist and wheel from this commit
        run: uv build --out-dir dist

      - name: Check the wheel is the version the images get
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          ls dist
          test -f "dist/jotflow-$VERSION-py3-none-any.whl"
          test -f "dist/jotflow-$VERSION.tar.gz"
          # The deployment files jotflow init writes outside a checkout.
          for name in docker-compose.yml docker-compose.policy.yml agent.env.example agent-exec.env.example; do
            python3 -m zipfile -l "dist/jotflow-$VERSION-py3-none-any.whl" | grep -q "jotflow/templates/$name"
          done

      - name: Install the wheel alone and render the published Compose files
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          uv venv --python 3.12 /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python "dist/jotflow-$VERSION-py3-none-any.whl"
          /tmp/smoke/bin/jotflow --version | tee /tmp/version
          grep -qx "jotflow $VERSION" /tmp/version
          mkdir -p /tmp/deploy && cd /tmp/deploy
          /tmp/smoke/bin/python - <<'PY'
          import os
          from pathlib import Path
          from jotflow import deploy

          # From the wheel only: this folder is no checkout.
          version = os.environ["VERSION"]
          Path("docker-compose.yml").write_text(
              deploy.published_compose(deploy.template(deploy.COMPOSE), version)
          )
          Path("docker-compose.policy.yml").write_text(deploy.template(deploy.COMPOSE_POLICY))
          Path("jotflow.toml").touch()
          PY
          docker compose -f docker-compose.yml -f docker-compose.policy.yml --profile agent config --quiet
          if grep -q "build:" docker-compose.yml; then echo "::error::the published Compose file builds"; exit 1; fi
          grep -q "ghcr.io/jnkman787/jotflow:$VERSION" docker-compose.yml

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  pypi:
    name: Publish to PyPI
    # After the images, so a version on PyPI always has its images on GHCR.
    needs: [version, package, publish]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/jotflow/${{ needs.version.outputs.version }}/
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing, and signing the attestations
      attestations: write # store the build provenance
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Publish with trusted publishing, no token stored
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
