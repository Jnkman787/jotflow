name: Release

# A version tag vX.Y.Z publishes both images to GHCR, for amd64 and arm64,
# as :X.Y.Z and :latest, each with a signed build provenance attestation
# (#39). A pull request that touches this file or a Dockerfile runs the same
# builds and pushes nothing, so a release is proven before its tag exists.
#
# No secrets beyond GITHUB_TOKEN, no third-party build actions (the runner's
# own docker buildx builds natively on each architecture's runner), and every
# action pinned by commit SHA.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Dockerfile
      - Dockerfile.agent
      - docker-compose.yml

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: jnkman787

jobs:
  version:
    name: Version matches the tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
      agent_packages: ${{ steps.check.outputs.agent_packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag, pyproject.toml and __version__ agree
        id: check
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re, tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          init = re.search(r'^__version__ = "([^"]+)"$', Path("src/jotflow/__init__.py").read_text(), re.M)
          module = init.group(1) if init else None
          compose = Path("docker-compose.yml").read_text()
          pin = re.search(r'AGENT_NPM_PACKAGES: "([^"]+)"', compose)
          if not pin:
              raise SystemExit("::error::no AGENT_NPM_PACKAGES pin in docker-compose.yml")
          publish = os.environ["REF_TYPE"] == "tag"
          if publish:
              tag = os.environ["REF_NAME"]
              if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
                  raise SystemExit(f"::error::{tag} is not a vX.Y.Z tag")
              version = tag[1:]
              if project != version or module != version:
                  raise SystemExit(
                      f"::error::tag {tag} but pyproject.toml says {project} "
                      f"and __version__ says {module}"
                  )
          else:
              version = project
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={version}\n")
              out.write(f"publish={'true' if publish else 'false'}\n")
              out.write(f"agent_packages={pin.group(1)}\n")
          print(f"version {version}, publish {publish}, agent CLI {pin.group(1)}")
          PY

  build:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write # push by digest, tag runs only
    strategy:
      fail-fast: true
      matrix:
        image: [jotflow, jotflow-agent]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - image: jotflow
            dockerfile: Dockerfile
          - image: jotflow-agent
            dockerfile: Dockerfile.agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        if: needs.version.outputs.publish == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login "$REGISTRY" -u "$ACTOR" --password-stdin

      - name: Build, and on a tag push by digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.version.outputs.version }}
          PUBLISH: ${{ needs.version.outputs.publish }}
          AGENT_PACKAGES: ${{ needs.version.outputs.agent_packages }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx create --use --name release >/dev/null
          args=(
            --platform "linux/$ARCH"
            --file "$DOCKERFILE"
            --provenance=mode=max
            --label "org.opencontainers.image.source=$SOURCE"
            --label "org.opencontainers.image.revision=$REVISION"
            --label "org.opencontainers.image.version=$VERSION"
            --label "org.opencontainers.image.licenses=Apache-2.0"
            --metadata-file metadata.json
          )
          if [ "$DOCKERFILE" = Dockerfile.agent ]; then
            args+=(--build-arg "AGENT_NPM_PACKAGES=$AGENT_PACKAGES")
          fi
          if [ "$PUBLISH" = true ]; then
            args+=(--output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true")
          else
            args+=(--output "type=cacheonly")
          fi
          docker buildx build "${args[@]}" .
          mkdir -p digests
          if [ "$PUBLISH" = true ]; then
            digest=$(python3 -c 'import json; print(json.load(open("metadata.json"))["containerimage.digest"])')
            touch "digests/${digest#sha256:}"
          fi

      - name: Keep the digest for publishing
        if: needs.version.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.image }}
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # tag the index
      id-token: write # sign the attestation
      attestations: write # store it
    strategy:
      matrix:
        image: [jotflow, jotflow-agent]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-${{ matrix.image }}-*
          path: digests
          merge-multiple: true

      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login "$REGISTRY" -u "$ACTOR" --password-stdin

      - name: Tag one index for both architectures
        id: index
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          sources=()
          for file in digests/*; do sources+=("$IMAGE@sha256:$(basename "$file")"); done
          test "${#sources[@]}" -eq 2
          docker buildx imagetools create --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" "${sources[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["digest"])')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "$IMAGE:$VERSION is $digest"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
