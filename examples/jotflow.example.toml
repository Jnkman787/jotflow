# jotflow.toml: which channels JotFlow watches, which repos they feed, and who
# may approve. `uvx jotflow init` writes your jotflow.toml for you, in your
# JotFlow folder; this example shows every option. To write one by hand
# instead, save this file there as jotflow.toml and replace every value. After
# editing it, run `docker compose restart jotflow` so JotFlow reads it again. All ids, repos, and names below are
# made up. Secrets never go here; the Slack tokens live in .env. Unknown keys
# are rejected, so typos fail loudly.

# "permalinks" puts the Slack permalinks a proposal came from in the issue
# body, so the store can be rebuilt from Slack. "none" keeps permalinks and
# every other workspace detail out of issue bodies.
issue_links = "permalinks"

# How long a conversation must be quiet, in seconds, before JotFlow drafts an
# issue from it, so a burst of replies is read together. A channel may set its own.
debounce_seconds = 120

# How many days a topic stays in the list the agent sees after the last message
# linked to it. Older topics are kept, just not shown, so a reply months later
# can still find its issue.
topic_window_days = 14

# The reaction JotFlow adds to the messages an issue came from, once the issue
# is written, next to its reply in the thread with the issue's link. A Slack
# emoji name without colons; "" for none. It cannot be white_check_mark, which
# confirms a keyword.
issue_reaction = "ticket"

[agent]
# Which agent program drafts and writes issues. It must name the same preset
# as JOTFLOW_AGENT_PRESET in agent.env and agent-exec.env, except with codex,
# where agent-exec.env stays on claude-code, as JotFlow expects. Setup writes
# all of them when you choose one. Leave it out and JotFlow connects to Slack
# but starts no agent runs.
#   claude-code  Claude Code, for every run kind
#   codex        Codex CLI, for drafting and question runs; agent-exec.env
#                stays on claude-code for execution (docs/presets.md)
#   command      your own JOTFLOW_AGENT_COMMAND in the agent files
# preset = "claude-code"
# How many agent runs may run at once, across all channels. One thread never
# has two at once, whatever this says. From 1 to 32; the default is 2.
max_concurrent_runs = 2

[approval]
# Slack user ids allowed to approve and change channel modes. Empty, the
# default, lets anyone in the channel approve, including their own proposals.
# A listed approver may approve their own proposals too, unless
# require_second_approver is true.
approvers = []
# With approvers listed, true refuses an approver who wrote the thread's first
# message or a message the proposal cites, so every write needs a second
# person. Off by default. It needs approvers: alone, it's refused.
require_second_approver = false
# Whether a reaction on a card counts as approval. Off by default. When on,
# the reaction runs every check the Approve button does, and approves only a
# card that shows the current draft in full.
reactions = false
# The emoji that approves, by name without colons, ignored while reactions is
# false. It may not be one that already means a keyword, such as no_entry_sign
# for skip, or white_check_mark, which JotFlow adds itself to confirm one.
reaction = "heavy_check_mark"

[help]
# How JotFlow helps people who forget the keywords. Everything it posts is
# plain text that pings nobody. A channel may set any of these for itself.
# Post a short guide and pin it, once per channel.
guide = true
# Tell a person privately, once, about /jotflow help on their first message.
newcomer_tip = true
# Tell a person privately, once, when a message looks like a mistyped keyword,
# such as "skip" or "Idea - ..." without the colon. JotFlow never acts on it.
near_miss_nudge = true

[identity]
# Slack user ids that may remove someone else's GitHub link with
# /jotflow unlink <member-id>, as approvers always may. For a login someone
# claimed that isn't theirs. Empty, the default, leaves only approvers, or
# `jotflow identity unlink` on the host.
admins = []

# One table per Slack channel, keyed by channel id.
[channels.C0EXAMPLE1]
debounce_seconds = 60

# The repos this channel may feed. The agent picks one by its description.
# labels is optional. Without it, a proposal may use any label that already
# exists on the repo. Rule for the agent: never invent a label. JotFlow cannot
# check that rule itself; the agent's instructions carry it. A list narrows
# the choice to only the labels listed, and JotFlow enforces it. An empty
# list (labels = []) is an error: leave the line out to allow any label.
# visibility is optional too: "public" or "private", as on GitHub. A public
# repo puts a warning on every card, because approving makes the issue
# visible to anyone. JotFlow has no GitHub access, so this line is the source:
# the agent may add the warning when it sees a public repo, but never remove
# one. Without the line, cards say visibility was not checked.
# conventions is optional: the team's own rules for this repo's issues, in
# plain text of up to 2000 characters, such as required sections or label
# norms. The drafting agent follows them over the style of the repo's recent
# issues. They shape the title and body, and never relax JotFlow's own rules.
# title_pattern is optional: a regular expression every proposed title must
# fully match. JotFlow refuses a title that doesn't, and the agent tries
# again. Each match may take 50 ms at most; a title it can't check in time is
# refused too, and jotflow check warns about a pattern that slow. Not allowed:
# lookarounds, backreferences, conditionals, more than three *, + or {n,m}
# repeats, POSIX classes, and a { that doesn't start a repeat (write \{).
# Single quotes keep backslashes.
[[channels.C0EXAMPLE1.repos]]
repo = "example-org/web"
nickname = "web"
description = "The customer-facing web app: pages, sign-up, onboarding"
labels = ["bug", "enhancement", "size:s", "size:m", "size:l"]
visibility = "private"
title_pattern = '^(feat|fix|docs)(\([a-z-]+\))?: .+$'
conventions = "Every issue has an ## Acceptance checklist. Use size:s, size:m or size:l on every enhancement."

[[channels.C0EXAMPLE1.repos]]
repo = "example-org/api"
nickname = "api"
description = "The public REST API and its background jobs"
# No labels line: any label that exists on example-org/api.

[channels.G0EXAMPLE2]

[[channels.G0EXAMPLE2.repos]]
repo = "example-org/handbook"
nickname = "handbook"
description = "Team handbook and process docs"

# A scope finds repos live instead of listing them, for an org whose repos come
# and go (#236). owner is one GitHub org or user, never a pattern; match and
# exclude are globs on the repo name. JotFlow asks GitHub, through the drafting
# agent container's read token, every 15 minutes, so new and renamed repos
# appear without a restart. Forks and archived repos are left out unless
# include_forks or include_archived is true. A repo listed above always wins,
# with its own nickname, description and labels. A found repo's nickname is its
# name in lower case; aliases pins one. description is your own words for the
# scope, shown to the agent before each repo's description on GitHub.
# The write token must also reach a found repo: approval refuses one it can't.
[[channels.G0EXAMPLE2.scopes]]
owner = "example-org"
match = ["service-*", "lib-*"]
exclude = ["*-sandbox"]
include_forks = false
include_archived = false
description = "Backend services and shared libraries"
aliases = { auth = "service-authentication" }

# This channel keeps its own help quieter: no pinned guide.
[channels.G0EXAMPLE2.help]
guide = false
