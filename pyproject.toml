[project]
name = "jotflow"
version = "0.0.1"
description = "Turn team chat into GitHub issues. A self-hosted, agent-agnostic bridge from a shared Slack channel to your repos, with a human approval gate."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Joshua Matte" }]
keywords = ["slack", "github", "issues", "mcp", "agents"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Chat",
  "Topic :: Software Development :: Bug Tracking",
]
dependencies = [
  "slack-bolt>=1.21",
  "aiohttp>=3.10",
  "mcp>=2.3,<3",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "aiosqlite>=0.20",
  "starlette>=1.0",
  "uvicorn>=0.40",
  "slack-sdk>=3.33",
  "httpx2>=2.0",
]

[project.urls]
Homepage = "https://github.com/Jnkman787/jotflow"
Repository = "https://github.com/Jnkman787/jotflow"
Issues = "https://github.com/Jnkman787/jotflow/issues"

[project.scripts]
jotflow = "jotflow.cli:main"

[dependency-groups]
dev = [
  "ruff>=0.8",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "mypy>=1.13",
  "pytest-cov>=6.0",
  "httpx2>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jotflow"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source_pkgs = ["jotflow"]
branch = true

[tool.coverage.report]
# The floor for line and branch coverage; make check and CI fail below it.
fail_under = 80
show_missing = true
exclude_also = ['if __name__ == "__main__":']

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["jotflow"]
mypy_path = "src"
